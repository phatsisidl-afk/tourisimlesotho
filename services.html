<section class="page-title">
  <div class="container">
    <p2><h1>Services</h1></p2>

<section class="py-5">
  <div class="container">
  <div class="row g-3 mb-4 align-items-center">
    <div class="col-12 col-md-5">
      <label for="searchBox">Search</label>
      <input type="search" id="searchBox" class="form-control" placeholder="Search destinations, lodges, activities">
    </div>

    <section class="py-5">
  <div class="container">
    <div class="row g-3 my-3">
      <div class="col-6">
        <img src="R.jpg" class="img-fluid rounded" alt="Pony trekking">
      </div>

      <div class="col-6">
        <img src="M.webp" class="img-fluid rounded" alt="Pony trekking">
      </div> 
    </div>

  <div id="lastBooking"></div>
    <h2 class="mt-5" id="book">Book Now</h2>
      <div class="row">
       <div class="col-12 col-lg-7">
        <div id="bookAlert">
  </div>

  <form id="bookForm">
    <div class="row">
    <div class="col-md-6">
    <div class="mb-3">

  <label>Username</label>
    <input type="text" class="form-control" id="bName" name="bName" required>
<div class="invalid-feedback">
</div>
</div>
</div>
      <div class="col-md-6">
        <div class="mb-3">
          <label for="bEmail" class="form-label">Email</label>
            <input type="email" class="form-control" required data-msg="Enter a valid email, like phatsisidl@gmail.com.">
<div class="invalid-feedback">
</div>
</div>
</div>

    <div class="col-md-6">
        <div class="mb-3label for="bService class="form-label">Service</label>
        <select id="bService" class="form-select" required>
          <option>Choose</option>
          <option>Maletsunyane Falls (M250)</option>
          <option>Thaba-Bosiu (M150)</option>
          <option>Sani Pass (M300)</option>
          <option>Semonkong Lodge (M900)</option>
          <option>Village Homestay (M450)</option>
          <option>Mountain Chalet (M1200)</option>
          <option>Pony Trekking (M400)</option>
          <option>Guided Hiking (M350)</option>
          <option>Afriski Skiing (M800)</option>
        </select>
        <div class="invalid-feedback">
  
        </div>
      </div>
    </div>
      <div class="col-md-6">
        <div class="mb-3">
          <label for="bPeople" class="form-label">Number of people</label>
            <input type="number" class="form-control" required min="1" max="10" value="1">
          <div class="invalid-feedback">
  
      </div>
      </div>
      </div>
    <div class="col-md-6">
       <div class="mb-3">
        <label for="bDays" class="form-label">Number of days</label>
          <input type="number" class="form-control" required min="1" max="14" value="1">
            <div class="invalid-feedback">
    </div>
    </div>
    </div>
    </div>
    <div class="mb-3">
      <label for="bNotes" class="form-label">How are feeling?</label>
      <textarea id="bNotes" class="form-control" rows="3"></textarea>
    </div>
    <p class="fs-5">Estimated total: <strong id="total">M0</strong></p>
    <button type="submit" class="btn btn-brand">Send booking</button>
  </form>
</div>
</div>
